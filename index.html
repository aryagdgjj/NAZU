<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Nazu</title>
<style>
:root{--bg:#FFE9EC;--ink:#3A1530;--accent:#B8213F;--env:#F4B6C0;--env2:#E99AAA;--flap:#F8C6CF;--paper:#FFFDF9;--paper-ink:#3A1530;--card:#FFF6F7}
@media (prefers-color-scheme: dark){:root{--bg:#2A1021;--ink:#FFE9EC;--accent:#FF8CA3;--env:#8E3A55;--env2:#6F2A45;--flap:#A04865;--card:#3A1830}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;display:none;flex-direction:column;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));overflow-y:auto;text-align:center}
.scene.on{display:flex;animation:fade .8s ease}
.wrap{margin:auto;width:100%;max-width:460px}
h1,h2{font-weight:400;font-style:italic;color:var(--accent);margin:0 0 18px;line-height:1.1}
h1{font-size:clamp(48px,16vw,84px)}
h2{font-size:clamp(34px,10vw,48px)}
p{font-size:20px;line-height:1.55;margin:0 0 16px}
.btn{font:inherit;font-size:20px;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:14px 30px;min-height:48px;cursor:pointer;transition:transform .25s ease}
@media (prefers-color-scheme: dark){.btn{color:#2A1021}}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--accent)}
.hint{font-size:20px;letter-spacing:.04em;margin:0 0 36px;animation:pulse 2s ease-in-out infinite}
.env{position:relative;display:block;margin:0 auto;width:min(78vw,340px);aspect-ratio:3/2;border:0;background:none;padding:0;cursor:pointer;perspective:900px;animation:bob 3s ease-in-out infinite}
.env>div{position:absolute}
.back{inset:0;background:var(--env2);border-radius:8px}
.letter{left:8%;right:8%;top:6%;height:82%;background:var(--paper);color:var(--paper-ink);border-radius:6px;z-index:2;padding-top:16px;font-size:26px;font-style:italic;transition:transform .8s .5s ease}
.front{inset:0;background:var(--env);clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%);border-radius:8px;z-index:3}
.flap{left:0;top:0;width:100%;height:56%;background:var(--flap);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .6s ease;z-index:4}
.seal{left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--accent);z-index:5;color:#fff;font-size:22px;line-height:46px;transition:opacity .3s}
.to{left:0;right:0;bottom:12%;z-index:6;font-size:24px;font-style:italic;color:var(--paper-ink)}
.open{animation:none}
.open .flap{transform:rotateX(180deg);z-index:1}
.open .letter{transform:translateY(-52%)}
.open .seal{opacity:0}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:28px 24px;box-shadow:0 10px 30px rgba(58,21,48,.18);text-align:left;margin-bottom:24px}
.paper p{animation:fade 1s ease;margin-bottom:14px}
.paper .nm{font-style:italic;font-size:26px;color:#B8213F}
.row{display:flex;gap:16px;justify-content:center;align-items:center;min-height:120px}
.promises{display:flex;flex-direction:column;gap:14px;margin-bottom:24px}
.pr{font:inherit;color:var(--ink);background:var(--card);border:2px dashed var(--accent);border-radius:18px;padding:20px;min-height:84px;cursor:pointer;font-size:21px;line-height:1.35}
.pr small{display:block;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px;font-weight:700}
.pr.rev{border-style:solid;background:var(--paper);color:var(--paper-ink)}
#s4{background:#1E0B18;color:#FFE9EC}
.av{width:104px;height:104px;border-radius:50%;background:#B8213F;color:#fff;font-size:48px;line-height:104px;margin:0 auto 18px;position:relative;font-style:italic}
.av:before,.av:after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #FF8CA3;animation:ring 2s ease-out infinite}
.av:after{animation-delay:1s}
.call{display:flex;justify-content:center;gap:56px;margin-top:48px}
.cb{font:inherit;color:#fff;border:0;border-radius:50%;width:72px;height:72px;font-size:15px;cursor:pointer}
.cb.no{background:#B3261E}.cb.yes{background:#1F7A45;animation:shake 1.2s ease-in-out infinite}
.small{font-size:16px;opacity:.85}
.heart{position:fixed;bottom:-30px;color:var(--accent);pointer-events:none;z-index:10;animation:rise linear forwards}
#s4 ~ .heart,.heart.l{color:#FF8CA3}
@keyframes rise{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{opacity:.5}}
@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
@keyframes shake{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(-8deg)}20%,40%{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section class="scene on" id="s0">
<div class="wrap">
<p class="hint" id="hint">Nazu, this one is for you. Tap the envelope.</p>
<button class="env" id="env" type="button" aria-label="Open the letter">
<div class="back"></div>
<div class="letter">Sorry</div>
<div class="front"></div>
<div class="flap"></div>
<div class="seal" aria-hidden="true">&#9829;</div>
<div class="to">For Nazu</div>
</button>
</div>
</section>

<section class="scene" id="s1">
<div class="wrap">
<div class="paper" id="paper"><p class="nm">Dear Nazu,</p></div>
<button class="btn" id="next" type="button">Next</button>
</div>
</section>

<section class="scene" id="s2">
<div class="wrap">
<h2>Will you forgive me?</h2>
<div class="row">
<button class="btn" id="yes" type="button">Yes</button>
<button class="btn ghost" id="no" type="button">No</button>
</div>
<p class="small" id="dodge" style="min-height:28px"></p>
</div>
</section>

<section class="scene" id="s3">
<div class="wrap">
<h2>Three promises, just for you</h2>
<p class="small">Tap each one to open it.</p>
<div class="promises">
<button class="pr" type="button" data-t="One full evening of my undivided attention. Phone far away."><small>Promise 1</small><span>Tap to open</span></button>
<button class="pr" type="button" data-t="Snacks of your choice. You pick, I carry."><small>Promise 2</small><span>Tap to open</span></button>
<button class="pr" type="button" data-t="Your favourite show, start to finish, with zero phone checks."><small>Promise 3</small><span>Tap to open</span></button>
</div>
<button class="btn" id="go4" type="button" style="display:none">One last thing</button>
</div>
</section>

<section class="scene" id="s4">
<div class="wrap">
<div class="av" aria-hidden="true">A</div>
<h2 id="cn" style="color:#FF8CA3">Annu is calling</h2>
<p class="small" id="cs">Pick up this time? I’m picking up on the very first ring.</p>
<div class="call" id="cc">
<button class="cb no" id="dec" type="button" aria-label="Decline">Later</button>
<button class="cb yes" id="acc" type="button" aria-label="Answer">Answer</button>
</div>
</div>
</section>

<script>
(function(){
var S=[].slice.call(document.querySelectorAll('.scene'));
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function go(i){S.forEach(function(s,j){s.classList.toggle('on',j===i);});}
function heart(){
if(reduce)return;
var h=document.createElement('span');
h.className='heart';h.textContent='\u2665';
h.style.left=Math.random()*100+'vw';
h.style.fontSize=(16+Math.random()*28)+'px';
h.style.animationDuration=(3+Math.random()*3)+'s';
h.style.animationDelay=(Math.random()*0.8)+'s';
document.body.appendChild(h);
setTimeout(function(){h.remove();},7500);
}
function burst(n){for(var i=0;i<n;i++)heart();}
setInterval(heart,2200);

var env=document.getElementById('env');
env.addEventListener('click',function(){
if(env.classList.contains('open'))return;
env.classList.add('open');
document.getElementById('hint').style.visibility='hidden';
setTimeout(function(){go(1);burst(14);},1700);
});

var lines=[
'You called, and I didn’t pick up.',
'I know that stings, and I’m truly sorry.',
'You’re the first person I want to talk to, every single time.',
'So I made you something instead of an excuse.',
'— Annu'
];
var li=0,paper=document.getElementById('paper'),next=document.getElementById('next');
next.addEventListener('click',function(){
if(li<lines.length){
var p=document.createElement('p');
p.textContent=lines[li];
if(li===lines.length-1){p.className='nm';}
paper.appendChild(p);li++;
if(li===lines.length)next.textContent='Continue';
}else{go(2);}
});

var yes=document.getElementById('yes'),no=document.getElementById('no'),dodge=document.getElementById('dodge');
var n=0,msgs=['Hmm, that button seems broken.','Try again?','It really doesn’t want to be pressed.','Okay, you clearly meant yes.'];
no.addEventListener('click',function(){
dodge.textContent=msgs[Math.min(n,msgs.length-1)];
n++;
yes.style.transform='scale('+Math.min(1+n*0.18,1.7)+')';
var x=(Math.random()*120-60),y=(Math.random()*80-40);
no.style.transform='translate('+x+'px,'+y+'px) scale('+Math.max(1-n*0.15,0.4)+')';
if(n>=4){no.style.display='none';}
});
yes.addEventListener('click',function(){burst(40);setTimeout(function(){go(3);},900);});

var prs=[].slice.call(document.querySelectorAll('.pr')),opened=0;
prs.forEach(function(b){
b.addEventListener('click',function(){
if(b.classList.contains('rev'))return;
b.classList.add('rev');
b.querySelector('span').textContent=b.getAttribute('data-t');
opened++;burst(6);
if(opened===prs.length)document.getElementById('go4').style.display='inline-block';
});
});
document.getElementById('go4').addEventListener('click',function(){go(4);});

var cn=document.getElementById('cn'),cs=document.getElementById('cs'),cc=document.getElementById('cc'),dec=document.getElementById('dec');
dec.addEventListener('click',function(){cs.textContent='Nazu, please? I’ll wait right here.';});
document.getElementById('acc').addEventListener('click',function(){
cn.textContent='Picked up. Promise kept.';
cs.innerHTML='I’m sorry, Nazu. You mean the world to me.<br><br>Now call me back, and I’ll answer on the first ring.<br><br>Yours, Annu';
cc.style.display='none';
burst(50);
});
})();
</script>
</body>
</html>
